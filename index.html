<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joel · OARS Script Builder</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400&display=swap');

:root {
  --bg:#0d0d14;--panel:#13131e;--sidebar:#0f0f18;--border:#1e2235;
  --text:#e0e8ff;--muted:#6b7aaa;--header-bg:#080810;
  --gold:#00ff88;--accent:#00e676;--accent2:#ff4f6d;
  --c1:#ff3d2e;--c2:#ff8c00;--c3:#00c853;--c4:#00b0ff;--c5:#d500f9;
  --c6:#ff1744;--c7:#00e5ff;--c8:#ffab00;--c9:#3d5afe;--ca:#f50057;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}

/* BACKUP BANNER */
#backupBanner{display:none;background:linear-gradient(90deg,rgba(255,171,0,.12),rgba(255,171,0,.06));border-bottom:1px solid rgba(255,171,0,.35);padding:8px 22px;font-size:12px;color:#ffcc40;font-weight:600;align-items:center;gap:10px;}
#backupBanner.show{display:flex;}
#backupBanner .banner-icon{font-size:15px;}
#backupBanner .banner-text{flex:1;}
#backupBanner .banner-export{background:rgba(255,171,0,.2);border:1px solid rgba(255,171,0,.4);color:#ffcc40;font-family:inherit;font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;}
#backupBanner .banner-export:hover{background:rgba(255,171,0,.35);}
#backupBanner .banner-dismiss{background:none;border:none;color:rgba(255,171,0,.5);cursor:pointer;font-size:16px;padding:0 4px;}

/* HEADER */
header{background:var(--header-bg);border-bottom:2px solid var(--gold);padding:0 22px;height:56px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:300;box-shadow:0 2px 20px rgba(0,255,136,.08);}
.logo{color:#fff;font-size:16px;font-weight:700;white-space:nowrap;letter-spacing:-.3px;}
.logo span{color:var(--gold);}
.search-wrap{flex:1;max-width:300px;position:relative;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none;filter:invert(30%) sepia(100%) saturate(500%) hue-rotate(330deg) brightness(1.4);}
#searchBox{width:100%;padding:7px 12px 7px 32px;background:rgba(255,40,10,.32);border:2px solid rgba(255,61,46,.9);border-radius:20px;color:#fff;font-size:13px;font-family:inherit;outline:none;box-shadow:0 0 20px rgba(255,61,46,.5),inset 0 0 20px rgba(255,40,10,.35);}
#searchBox::placeholder{color:rgba(255,130,110,.9);}
#searchBox:focus{background:rgba(255,40,10,.42);border-color:#ff3d2e;}
#clearBtn{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 8px;display:none;}
.hdr-btn{background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.25);color:var(--gold);font-size:11px;font-weight:700;padding:6px 12px;border-radius:20px;cursor:pointer;font-family:inherit;white-space:nowrap;letter-spacing:.3px;transition:background .15s;}
.hdr-btn:hover{background:rgba(0,255,136,.16);}
.hdr-btn.export-btn{background:rgba(0,176,255,.08);border-color:rgba(0,176,255,.3);color:#00b0ff;}
.hdr-btn.export-btn:hover{background:rgba(0,176,255,.18);}
.hdr-btn.import-btn{background:rgba(255,171,0,.08);border-color:rgba(255,171,0,.3);color:#ffab00;}
.hdr-btn.import-btn:hover{background:rgba(255,171,0,.18);}
#importFileInput{display:none;}

/* TABS */
.tabs{display:flex;background:var(--header-bg);padding:0 22px;border-bottom:1px solid var(--border);gap:4px;}
.tab-btn{padding:10px 20px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;margin-bottom:-1px;transition:color .15s;}
.tab-btn:hover{color:rgba(255,255,255,.8);}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}

/* LAYOUT */
.tab-page{display:none;}
.tab-page.active{display:flex;}

/* SIDEBAR */
.sidebar{width:234px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);overflow-y:auto;padding:14px 12px 20px;}
.sidebar::-webkit-scrollbar{width:4px;}
.sidebar::-webkit-scrollbar-thumb{background:#1e2235;border-radius:4px;}
.section-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px;color:var(--gold);background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.18);border-radius:5px;padding:5px 8px;margin:16px 0 8px;display:flex;align-items:center;gap:5px;}
.section-label:first-child{margin-top:0;}
.section-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;}
.section-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.section-actions{display:flex;gap:3px;flex-shrink:0;}
.section-icon-btn{background:none;border:none;cursor:pointer;font-size:10px;padding:1px 3px;border-radius:3px;color:rgba(0,255,136,.5);line-height:1;transition:color .15s,background .15s;}
.section-icon-btn:hover{color:var(--gold);background:rgba(0,255,136,.15);}
.section-icon-btn.del:hover{color:#ff6b87;background:rgba(255,79,109,.15);}
.section-rename-input{flex:1;background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.35);border-radius:4px;color:#fff;font-family:inherit;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;outline:none;padding:1px 5px;}

.script-btn{display:block;width:100%;padding:7px 14px;margin-bottom:5px;border:none;border-radius:20px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;text-align:left;line-height:1.3;color:#fff;letter-spacing:.2px;transition:filter .15s,transform .1s,box-shadow .15s;}
.script-btn:hover{filter:brightness(1.2);transform:translateX(3px);box-shadow:0 2px 12px rgba(0,0,0,.4);}
.script-btn.active{outline:2px solid var(--gold);outline-offset:1px;filter:brightness(1.15);box-shadow:0 0 12px rgba(0,255,136,.2);}
.btn-icon{margin-right:5px;font-size:11px;}
.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c5)}
.c6{background:var(--c6)}.c7{background:var(--c7)}.c8{background:var(--c8)}.c9{background:var(--c9)}.ca{background:var(--ca)}

.add-group-btn{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;padding:6px 10px;margin-top:14px;background:rgba(0,176,255,.07);border:1px dashed rgba(0,176,255,.3);border-radius:20px;color:#00b0ff;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.5px;transition:background .15s;}
.add-group-btn:hover{background:rgba(0,176,255,.14);border-color:rgba(0,176,255,.5);}
.add-script-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:7px 10px;margin-top:6px;background:rgba(0,255,136,.07);border:1px dashed rgba(0,255,136,.3);border-radius:20px;color:var(--gold);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;letter-spacing:.5px;}
.add-script-btn:hover{background:rgba(0,255,136,.14);border-color:rgba(0,255,136,.5);}

/* SCRIPT VIEW */
.script-view{flex:1;background:var(--panel);overflow-y:auto;padding:28px 32px;}
.script-view::-webkit-scrollbar{width:5px;}
.script-view::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.placeholder{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:300px;gap:14px;text-align:center;overflow:hidden;}
.placeholder-bg-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;pointer-events:none;}
.placeholder-bg-text span{font-size:72px;font-weight:900;text-transform:uppercase;letter-spacing:12px;white-space:nowrap;user-select:none;}
.placeholder-bg-text span:nth-child(1){color:rgba(255,61,46,.18);}
.placeholder-bg-text span:nth-child(2){color:rgba(0,255,136,.18);}
.placeholder-bg-text span:nth-child(3){color:rgba(0,176,255,.18);}
.placeholder-hand{font-size:62px;position:relative;z-index:1;filter:hue-rotate(80deg) saturate(4) brightness(1.2);}
.placeholder-label{font-size:15px;color:rgba(0,255,136,.35);font-weight:600;letter-spacing:1px;position:relative;z-index:1;}
.placeholder-sub{font-size:12px;color:var(--muted);position:relative;z-index:1;margin-top:-6px;}

.script-panel{display:none;}
.script-panel.active{display:block;}
.script-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:5px;}
.script-when{font-size:12px;color:var(--muted);margin-bottom:22px;font-style:italic;}
.fields{background:rgba(0,255,136,.05);border:1px solid rgba(0,255,136,.18);border-radius:8px;padding:14px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px;}
.field-row{display:flex;align-items:center;gap:10px;}
.field-row label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--gold);width:60px;flex-shrink:0;}
.field-row input{flex:1;padding:7px 11px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;color:#fff;outline:none;}
.field-row input:focus{border-color:var(--gold);background:rgba(0,255,136,.06);}
.field-row input::placeholder{color:var(--muted);}
.field-val{flex:1;font-size:13px;font-weight:600;color:var(--gold);opacity:.85;}
.script-box{position:relative;}
textarea.script-text{width:100%;padding:16px 18px;padding-top:50px;background:#0a0a12;border:1px solid var(--border);border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.75;color:#c8d8ff;resize:none;outline:none;}
textarea.script-text:focus{border-color:rgba(0,255,136,.35);}
.copy-btn{position:absolute;top:10px;right:10px;background:var(--gold);color:#000;border:none;padding:6px 18px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:background .15s;}
.copy-btn:hover{background:#00e676;box-shadow:0 0 14px rgba(0,255,136,.4);}
.copy-btn.done{background:#00c853;}
.delete-btn{position:absolute;top:10px;right:98px;background:rgba(255,79,109,.15);color:#ff6b87;border:1px solid rgba(255,79,109,.3);padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;}
.delete-btn:hover{background:rgba(255,79,109,.3);}
.save-indicator{margin-top:6px;font-size:11px;font-weight:700;min-height:16px;letter-spacing:.3px;}
.title-row{display:flex;align-items:center;gap:10px;margin-bottom:5px;}
.rename-btn{background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.25);color:var(--gold);border-radius:6px;padding:3px 9px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
.title-input{font-size:20px;font-weight:700;color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--gold);border-radius:6px;padding:3px 10px;font-family:inherit;outline:none;flex:1;}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:500;display:none;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:#13131e;border:1px solid rgba(0,255,136,.2);border-radius:14px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 0 60px rgba(0,255,136,.08),0 24px 60px rgba(0,0,0,.6);}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-header h2{font-size:18px;font-weight:700;color:var(--gold);}
.modal-close{background:rgba(255,255,255,.06);border:none;width:30px;height:30px;border-radius:50%;color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:rgba(255,79,109,.2);color:#ff6b87;}
.modal-body{padding:20px 22px 24px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--gold);margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;color:#fff;outline:none;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold);background:rgba(0,255,136,.05);}
.form-group input::placeholder,.form-group textarea::placeholder{color:var(--muted);}
.form-group select option{background:#13131e;}
.form-group textarea{resize:vertical;min-height:160px;}
.color-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.color-swatch{height:34px;border-radius:20px;cursor:pointer;border:2px solid transparent;transition:transform .1s,box-shadow .15s;}
.color-swatch:hover{transform:scale(1.08);}
.color-swatch.selected{border-color:var(--gold);box-shadow:0 0 10px rgba(0,255,136,.4);}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding-top:16px;border-top:1px solid var(--border);margin-top:4px;}
.btn-cancel{padding:8px 20px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer;}
.btn-save{padding:8px 24px;background:var(--gold);border:none;border-radius:20px;color:#000;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;}
.btn-save:hover{background:#00e676;}

/* IMPORT MODAL */
#importModal .modal{max-width:460px;}
.import-summary{background:rgba(0,255,136,.05);border:1px solid rgba(0,255,136,.18);border-radius:8px;padding:14px 16px;margin-bottom:16px;font-size:13px;line-height:1.8;}
.import-summary strong{color:var(--gold);}
.import-merge-choice{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.merge-option{display:flex;align-items:flex-start;gap:10px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;}
.merge-option input[type=radio]{margin-top:2px;flex-shrink:0;accent-color:var(--gold);}
.merge-option-label{font-size:13px;font-weight:700;color:#fff;}
.merge-option-desc{font-size:11px;color:var(--muted);margin-top:2px;}

/* SEARCH */
#searchPage{display:none;}
#searchPage.active{display:block;}
.search-results{padding:20px 24px;max-width:760px;}
.search-banner{background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.22);border-radius:8px;padding:8px 14px;font-size:12.5px;margin-bottom:14px;display:none;color:var(--gold);font-weight:600;}
.search-banner.on{display:block;}
.search-hit{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:8px;padding:12px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s;}
.search-hit:hover{border-left-color:var(--accent2);}
.search-hit-title{font-weight:700;color:#fff;font-size:14px;}
.search-hit-tab{font-size:11px;color:var(--gold);margin-top:3px;font-weight:600;}
.search-hit-when{font-size:12px;color:#6b7aaa;margin-top:4px;font-style:italic;}

/* TAB MANAGER */
#tabManagerModal .modal{max-width:460px;}
.tab-manager-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.tab-manager-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:8px 12px;}
.tab-manager-row input{flex:1;background:transparent;border:none;font-family:inherit;font-size:13px;color:#fff;outline:none;padding:2px 4px;}
.tab-remove-btn{background:none;border:none;color:rgba(255,79,109,.5);cursor:pointer;font-size:16px;padding:0 4px;line-height:1;}
.tab-remove-btn:hover{color:#ff6b87;}
.add-tab-row-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;background:rgba(0,255,136,.06);border:1px dashed rgba(0,255,136,.28);border-radius:8px;color:var(--gold);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.tab-manager-hint{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6;}
</style>
</head>
<body>

<div id="backupBanner">
  <span class="banner-icon">💾</span>
  <span class="banner-text">Your scripts are saved in this browser only — export a backup so you don't lose them again.</span>
  <button class="banner-export" onclick="exportData()">⬇ Export Backup Now</button>
  <button class="banner-dismiss" onclick="dismissBanner()">✕</button>
</div>

<header>
  <div class="logo">Joel · <span>Script Builder</span></div>
  <div class="search-wrap">
    <svg width="14" height="14" fill="white" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398l3.85 3.85a1 1 0 0 0 1.415-1.415l-3.868-3.833zm-5.242 1.656a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
    <input id="searchBox" type="text" placeholder="Search all scripts…" oninput="doSearch(this.value)" autocomplete="off">
  </div>
  <button id="clearBtn" onclick="clearSearch()">✕ Clear</button>
  <button class="hdr-btn export-btn" onclick="exportData()">⬇ Export</button>
  <button class="hdr-btn import-btn" onclick="triggerImport()">⬆ Import</button>
  <button class="hdr-btn" onclick="openTabManager()">⚙ Tabs</button>
  <input type="file" id="importFileInput" accept=".json" onchange="handleImportFile(event)">
</header>

<div class="tabs" id="tabBar"></div>
<div id="searchPage">
  <div class="search-results">
    <div id="searchBanner" class="search-banner"></div>
    <div id="searchResults"></div>
  </div>
</div>
<div id="mainLayout"></div>

<!-- ADD SCRIPT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header"><h2>Add New Script</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Title</label><input type="text" id="m-title" placeholder="e.g. Student Check-In Email"></div>
      <div class="form-group"><label>Tab</label><select id="m-tab" onchange="refreshGroupSelect()"></select></div>
      <div class="form-group"><label>Group</label><select id="m-group"></select></div>
      <div class="form-group"><label>Type</label><select id="m-type"><option value="note">Case Note</option><option value="email">Email</option></select></div>
      <div class="form-group"><label>Subject Line</label><input type="text" id="m-subject" placeholder="e.g. Follow-Up – AT Support"></div>
      <div class="form-group"><label>Use When</label><input type="text" id="m-when" placeholder="e.g. After meeting with a student for the first time"></div>
      <div class="form-group"><label>Script / Body</label><textarea id="m-script" placeholder="Paste or type your full script here…"></textarea></div>
      <div class="form-group"><label>Button Color</label><div class="color-grid" id="colorGrid"></div></div>
      <div class="modal-footer"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" onclick="saveScript()">Save Script</button></div>
    </div>
  </div>
</div>

<!-- IMPORT MODAL -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <div class="modal-header"><h2>⬆ Import Backup</h2><button class="modal-close" onclick="closeImportModal()">✕</button></div>
    <div class="modal-body">
      <div class="import-summary" id="importSummary"></div>
      <div class="form-group">
        <label>How would you like to import?</label>
        <div class="import-merge-choice">
          <label class="merge-option"><input type="radio" name="mergeMode" value="merge" checked><div><div class="merge-option-label">Merge — keep existing + add imported</div><div class="merge-option-desc">Best for restoring scripts without losing what's already here.</div></div></label>
          <label class="merge-option"><input type="radio" name="mergeMode" value="replace"><div><div class="merge-option-label">Replace — overwrite everything</div><div class="merge-option-desc">Fully restores a backup, replacing all tabs, groups, and scripts.</div></div></label>
        </div>
      </div>
      <div class="modal-footer"><button class="btn-cancel" onclick="closeImportModal()">Cancel</button><button class="btn-save" onclick="confirmImport()">Import</button></div>
    </div>
  </div>
</div>

<!-- TAB MANAGER -->
<div class="modal-overlay" id="tabManagerModal">
  <div class="modal">
    <div class="modal-header"><h2>⚙ Manage Tabs</h2><button class="modal-close" onclick="closeTabManager()">✕</button></div>
    <div class="modal-body">
      <div class="tab-manager-list" id="tabManagerList"></div>
      <button class="add-tab-row-btn" onclick="addTabRow()">＋ Add Tab</button>
      <p class="tab-manager-hint">💡 Rename tabs to fit your workflow. Scripts stay attached when you rename a tab.</p>
      <div class="modal-footer"><button class="btn-cancel" onclick="closeTabManager()">Cancel</button><button class="btn-save" onclick="saveTabManager()">Save Tabs</button></div>
    </div>
  </div>
</div>

<script>
// ── STORAGE ──────────────────────────────────────────
const STORE='joel_sb_';
const jget=k=>{try{return JSON.parse(localStorage.getItem(STORE+k));}catch{return null;}};
const jset=(k,v)=>localStorage.setItem(STORE+k,JSON.stringify(v));
const sget=k=>localStorage.getItem(STORE+k);
const sset=(k,v)=>localStorage.setItem(STORE+k,v);
const sdel=k=>localStorage.removeItem(STORE+k);

  {id:'te1',tab:'tab-te',groupId:'grp-te-sched',color:'c1',type:'email',icon:'📅',title:'3-Day Advance Notice Reminder',when:'Student trying to book without 3 business days notice',subject:'Testing Room Booking',script:`Hi [Student Name],

  {id:'te2',tab:'tab-te',groupId:'grp-te-sched',color:'c5',type:'email',icon:'🧪',title:'Past Window – Two Options',when:'Student missed the 3-day window – give them two alternatives',subject:'Test Scheduling – Options',script:`Hi,

To book a test room with OARS, you will need to schedule a test room 3 days in advance. That is more than likely the reason why you are unable to schedule. So, you have two options:

1. Your instructor will need to proctor your exam and provide you with extra time and a distraction reduced environment (if they are able to).

2. Work with your instructor to coordinate a different day and time to take your test.

I am attaching the testing timeline to this email to show you when is the proper time to submit your test. Some students submit their finals and mid-terms ahead of time, so please get those in for sure! I also sent you step by step instructions in a separate email on how to schedule your exam in Accommodate.

If for ANY reason you are having issues with scheduling, please email Meredith, the OARS testing coordinator directly. Her contact information is mcummin1@highpoint.edu

If you have any questions, please let me know.

Thank you,
Joel`},

  {id:'te3',tab:'tab-te',groupId:'grp-te-sched',color:'c4',type:'email',icon:'📝',title:'How to Schedule via Accommodate',when:'Student emailed asking how to schedule their test with OARS',subject:'Scheduling Your Test Through Accommodate',script:`Hello,

To properly request to schedule your test with OARS you need to submit it via Accommodate. I have sent you instructions on how to do that. Please get this submission to us by this Friday at 5pm in order to test in our testing center. Please note that if this test is on a different date than your exam, your instructor must approve it. You may want to coordinate to make sure that this is okay.

When you submit your request, just be sure to select the day and leave the time frame. Then select check availability at the bottom. On the right side of the screen there will be different time slots and rooms to select. I am adding Meredith Cummings, the OARS Testing Coordinator, to advise if you have any trouble with scheduling. If you have any questions, please let Meredith know.

Thank you,
Joel`},

  {id:'te6',tab:'tab-te',groupId:'grp-te-faculty',color:'c6',type:'email',icon:'👨‍🏫',title:'Faculty – Final Exam Reminder',when:'Faculty has NOT uploaded exam material – final reminder before cancellation',subject:'Exam Information Needed – LAST REMINDER – OARS TESTING CENTER',script:`This is your FINAL REMINDER to complete the necessary Exam Information Form. One or more of your students have requested to take their exam in the OARS Testing Center, but OARS requires additional information from you in order to proctor the exam.

If the steps outlined below are not completed within 24 business hours prior to the scheduled exam, the OARS Testing Center will cancel the exam, the student will be instructed to return to class, and you will be expected to provide all of the testing accommodations for the student(s). If you have already completed the steps below, please contact Meredith Cummings, the OARS Testing Coordinator, to confirm receipt as there may be technical issues with the system that need to be addressed.

HOW TO COMPLETE THE EXAM INFORMATION FORM IN ACCOMMODATE
This step must be completed no later than 24 business hours prior to the student's scheduled exam.

1. Log into Accommodate: https://highpoint-accommodate.symplicity.com/faculty
2. Select Courses on the left-hand side of the screen.
3. Select the appropriate course.
4. Select Exam on the upper right-hand corner of the section.
5. Select the purple box with the text Add New Exam.

This is a time-sensitive matter, and it is imperative that you take immediate action to ensure your students receive their approved accommodations. If you have any questions or require assistance, please do not hesitate to contact Meredith Cummings, OARS Testing Coordinator. Thank you for your prompt attention to this matter!

Thank you,
Joel`},

  {id:'gen1',tab:'tab-gen',groupId:'grp-gen-housing',color:'c8',type:'email',icon:'🏠',title:'Housing Declined – Student Response',when:'Student declined ADA housing offer',subject:'ADA Housing Offer – OARS Follow-Up',script:`Hello,

I received the email below from housing regarding your decision to decline your ADA housing offer for the upcoming 2025-2026 academic year. Please note that if you would like to use your ADA housing accommodations for the 2026-2027 academic year, you must contact OARS by Feb 13, 2026, to be placed on the ADA housing list.

If you do not contact OARS by this date, then you will be placed in the traditional housing portal for housing selection. If you choose to implement your housing accommodations after the February 14th, 2026 deadline, you'll be prioritized for housing that meets your disability-related needs, but the University cannot guarantee an ADA placement.

Should you have any questions, please let me or [specialist first name] know.

Thanks,
Joel`},

  {id:'gen2',tab:'tab-gen',groupId:'grp-gen-housing',color:'c2',type:'email',icon:'🏠',title:'Housing – No Response / Delayed',when:'Student did not respond to ADA housing offer and it was marked declined',subject:'ADA Housing Offer – No Response on File',script:`Hi [Student Name],

I received the email below from housing regarding the ADA housing offer for the 2025-2026 school year. Because of no response, housing has noted that this was a declined offer.

Please note that if you would like to use your ADA housing accommodations for the 2025-2026 school year, you must contact OARS directly via email. If you choose to implement your ADA housing accommodation during the 2025-2026 school year, you'll be placed on a prioritized waitlist for housing that meets your disability-related needs.

Should you have any questions, please let me or [specialist first name] know.

  {id:'gen3',tab:'tab-gen',groupId:'grp-gen-housing',color:'c4',type:'email',icon:'🏠',title:'Housing – Suitemate Request Clarification',when:'Student requesting a specific number of suitemates through OARS',subject:'Housing Accommodation – Suitemate Clarification',script:`Hello,

I want to clarify that OARS does not have control over the number of suitemates assigned to you or who can be assigned to live with you. Our role is to determine if a student qualifies for ADA housing accommodations, such as the option to have or not have a roommate or suitemate, and then forward that approval to the Housing Office. The Housing Office is responsible for assigning housing locations and determining the number of suitemates based on availability.

For additional assistance, you may wish to contact your community director or the Housing Department directly.

If you'd like to move forward with requesting housing accommodation, with the understanding that we cannot guarantee a specific roommate or suitemate arrangement, please let me know, and I'll be happy to provide you with the necessary details.

Thank you,
Joel`},

  {id:'gen4',tab:'tab-gen',groupId:'grp-gen-housing',color:'c3',type:'email',icon:'🏠',title:'Incoming Freshman – Housing Accommodations',when:'Incoming freshman requesting housing accommodations (with deadline)',subject:'Housing Accommodation Request – Process Overview',script:`Hello,

Thanks for reaching out and submitting your housing accommodations request! I will be more than happy to guide you through the process. Please refer to the steps below to get started:

Register for OARS: please register by using this link: https://highpoint-accommodate.symplicity.com/public_accommodation/

Documentation: I've attached the housing forms, which must be completed by a licensed professional who is more familiar with your needs. Any additional documentation can be uploaded at the time of registering or emailed to OARS (Oars@highpoint.edu).

Intake Meeting: After completing registration and submitting your documentation, you will need to attend an intake meeting with an Accessibility Specialist. You will be emailed with instructions on how to schedule a meeting to your HPU email, so please be sure to check for this! This meeting, which can be held virtually or in person, will provide an opportunity for you and your assigned specialist to discuss your request.

Our process for any request takes 3-5 business days. This process cannot be expedited as it will be reviewed in the order in which it was received. If approved, you will be assigned housing based on your needs in available ADA-compliant housing. Please note that our office does not determine specific housing placements.

IMPORTANT: If your accommodation is approved before the deadline (February 15th for upperclassmen or April 15th for incoming students), you'll have equal access to accessible housing, though it doesn't guarantee a specific residence hall or room. After the deadline, you'll be prioritized for housing that meets your disability-related needs.

If you have any questions, feel free to reach out.

Thank you!
Joel`},

// ── INIT DATA ─────────────────────────────────────────
// Inject seed data only on first run
function initData() {
  const existing = jget('tabs');
  if (existing && existing.length > 0) {
    TABS    = existing;
    GROUPS  = jget('groups')  || [];
    SCRIPTS = jget('scripts') || [];
  } else {
    TABS    = SEED_TABS;
    GROUPS  = SEED_GROUPS;
    SCRIPTS = SEED_SCRIPTS;
    persist();
  }
}

let TABS=[], GROUPS=[], SCRIPTS=[];
initData();

let activeTab='tab-cn';
let selectedColor='c1';
let pendingImport=null;

const COLORS=[
  {cls:'c1',hex:'#ff3d2e'},{cls:'c2',hex:'#ff8c00'},{cls:'c3',hex:'#00c853'},
  {cls:'c4',hex:'#00b0ff'},{cls:'c5',hex:'#d500f9'},{cls:'c6',hex:'#ff1744'},
  {cls:'c7',hex:'#00e5ff'},{cls:'c8',hex:'#ffab00'},{cls:'c9',hex:'#3d5afe'},
  {cls:'ca',hex:'#f50057'},
];

function persist(){jset('tabs',TABS);jset('groups',GROUPS);jset('scripts',SCRIPTS);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── BANNER ────────────────────────────────────────────
function checkBanner(){
  if(SCRIPTS.length===0)return;
  const dismissed=sget('banner_dismissed');
  const today=new Date().toDateString();
  if(dismissed===today)return;
  document.getElementById('backupBanner').classList.add('show');
}
function dismissBanner(){
  sset('banner_dismissed',new Date().toDateString());
  document.getElementById('backupBanner').classList.remove('show');
}

// ── EXPORT ────────────────────────────────────────────
function exportData(){
  const edits={};
  SCRIPTS.forEach(s=>{
    const v=sget('edit_'+s.id); if(v!==null)edits[s.id]=v;
    const t=sget('title_'+s.id); if(t!==null)edits['title_'+s.id]=t;
  });
  const payload={version:1,exported:new Date().toISOString(),tabs:TABS,groups:GROUPS,scripts:SCRIPTS,edits};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`joel-scripts-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url); dismissBanner();
}

// ── IMPORT ────────────────────────────────────────────
function triggerImport(){document.getElementById('importFileInput').value='';document.getElementById('importFileInput').click();}
function handleImportFile(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.scripts||!Array.isArray(data.scripts))throw new Error('Invalid');
      pendingImport=data;
      document.getElementById('importSummary').innerHTML=`<strong>${data.scripts.length}</strong> scripts &nbsp;·&nbsp; <strong>${(data.groups||[]).length}</strong> groups &nbsp;·&nbsp; <strong>${(data.tabs||[]).length}</strong> tabs<br><span style="color:var(--muted);font-size:11px">Exported: ${data.exported?new Date(data.exported).toLocaleString():'Unknown'}</span>`;
      document.querySelector('input[name=mergeMode][value=merge]').checked=true;
      document.getElementById('importModal').classList.add('open');
    }catch{alert('That doesn\'t look like a valid backup file.');}
  };
  reader.readAsText(file);
}
function closeImportModal(){document.getElementById('importModal').classList.remove('open');pendingImport=null;}
function confirmImport(){
  if(!pendingImport)return;
  const mode=document.querySelector('input[name=mergeMode]:checked')?.value||'merge';
  const d=pendingImport;
  if(mode==='replace'){
    TABS=d.tabs||SEED_TABS; GROUPS=d.groups||[]; SCRIPTS=d.scripts||[];
    if(d.edits)Object.entries(d.edits).forEach(([k,v])=>sset(k,v));
  }else{
    const tids=new Set(TABS.map(t=>t.id)),gids=new Set(GROUPS.map(g=>g.id)),sids=new Set(SCRIPTS.map(s=>s.id));
    (d.tabs||[]).forEach(t=>{if(!tids.has(t.id))TABS.push(t);});
    (d.groups||[]).forEach(g=>{if(!gids.has(g.id))GROUPS.push(g);});
    (d.scripts||[]).forEach(s=>{if(!sids.has(s.id))SCRIPTS.push(s);});
    if(d.edits)Object.entries(d.edits).forEach(([k,v])=>{if(!sget(k))sset(k,v);});
  }
  persist(); closeImportModal(); buildAll(); showTab(TABS[0]?.id||activeTab);
}

// ── BUILD ─────────────────────────────────────────────
function buildAll(){
  buildColorGrid(); buildTabSelectInModal();
  const tabBar=document.getElementById('tabBar');
  const mainLayout=document.getElementById('mainLayout');
  tabBar.innerHTML=''; mainLayout.innerHTML='';
  TABS.forEach(t=>{
    const btn=document.createElement('button');
    btn.className='tab-btn';btn.id='tab-'+t.id;btn.textContent=t.label;btn.onclick=()=>showTab(t.id);
    tabBar.appendChild(btn);
    const page=document.createElement('div');page.className='tab-page';page.id='page-'+t.id;
    const sidebar=document.createElement('div');sidebar.className='sidebar';sidebar.id='sidebar-'+t.id;buildSidebar(sidebar,t.id);
    const view=document.createElement('div');view.className='script-view';view.id='view-'+t.id;buildView(view,t.id);
    page.appendChild(sidebar);page.appendChild(view);mainLayout.appendChild(page);
  });
}

function buildSidebar(sidebar,tabId){
  sidebar.innerHTML='';
  const tabGroups=GROUPS.filter(g=>g.tabId===tabId);
  const tabScripts=SCRIPTS.filter(s=>s.tab===tabId);
  const gidSet=new Set(tabGroups.map(g=>g.id));
  const ungrouped=tabScripts.filter(s=>!s.groupId||!gidSet.has(s.groupId));
  tabGroups.forEach(group=>{
    sidebar.appendChild(makeSectionLabel(group,tabId));
    tabScripts.filter(s=>s.groupId===group.id).forEach(s=>sidebar.appendChild(makeScriptBtn(s,tabId)));
    const addS=document.createElement('button');addS.className='add-script-btn';addS.innerHTML='＋ Add Script';addS.onclick=()=>openModal(tabId,group.id);sidebar.appendChild(addS);
  });
  if(ungrouped.length){
    const lbl=document.createElement('div');lbl.className='section-label';lbl.innerHTML='<span class="section-dot"></span><span class="section-name">Ungrouped</span>';sidebar.appendChild(lbl);
    ungrouped.forEach(s=>sidebar.appendChild(makeScriptBtn(s,tabId)));
  }
  const addG=document.createElement('button');addG.className='add-group-btn';addG.innerHTML='＋ Add Group';addG.onclick=()=>addGroup(tabId);sidebar.appendChild(addG);
  if(!tabGroups.length){const addS=document.createElement('button');addS.className='add-script-btn';addS.innerHTML='＋ Add Script';addS.onclick=()=>openModal(tabId,null);sidebar.appendChild(addS);}
}

function makeSectionLabel(group,tabId){
  const wrap=document.createElement('div');wrap.className='section-label';wrap.id='grp-lbl-'+group.id;
  wrap.innerHTML=`<span class="section-dot"></span><span class="section-name" id="grp-name-${group.id}">${esc(group.label)}</span><span class="section-actions"><button class="section-icon-btn" onclick="startGroupRename('${group.id}')" title="Rename">✏</button><button class="section-icon-btn del" onclick="deleteGroup('${group.id}','${tabId}')" title="Delete">✕</button></span>`;
  return wrap;
}

function makeScriptBtn(s,tabId){
  const title=sget('title_'+s.id)||s.title;
  const b=document.createElement('button');b.className='script-btn '+s.color;b.id='btn-'+s.id;
  b.innerHTML='<span class="btn-icon">'+(s.icon||'📄')+'</span>'+esc(title);
  b.onclick=()=>selectScript(s.id,tabId);return b;
}

function buildView(view,tabId){
  view.innerHTML=`<div class="placeholder" id="placeholder-${tabId}"><div class="placeholder-bg-text"><span>Scripts</span><span>OARS</span><span>Templates</span></div><div class="placeholder-hand">👈</div><div class="placeholder-label">Select a script from the left</div><div class="placeholder-sub">Use ＋ Add Script to add to any group</div></div>`;
  SCRIPTS.filter(s=>s.tab===tabId).forEach(s=>{view.innerHTML+=renderPanel(s);});
}

function renderPanel(s){
  const isEmail=s.type==='email';
  const title=sget('title_'+s.id)||s.title;
  const savedEdit=sget('edit_'+s.id);
  const scriptText=savedEdit!==null?savedEdit:s.script;
  const rows=Math.max(8,(s.script.match(/\n/g)||[]).length+4);
  const fieldsHtml=isEmail
    ?`<div class="fields"><div class="field-row"><label>Subject</label><input type="text" id="subj-${s.id}" value="${esc(s.subject||'')}"></div></div>`
    :`<div class="fields"><div class="field-row"><label>Date</label><input type="text" id="date-${s.id}" placeholder="e.g. July 7, 2025"></div><div class="field-row"><label>Subject</label><span class="field-val">${esc(s.subject||'')}</span></div></div>`;
  return `<div class="script-panel" id="panel-${s.id}"><div class="title-row"><div class="script-title" id="title-display-${s.id}">${s.icon||'📄'} ${esc(title)}</div><button class="rename-btn" onclick="startRename('${s.id}')">✏ Rename</button></div><div class="script-when">Use when: ${esc(s.when)}</div>${fieldsHtml}<div class="script-box"><button class="delete-btn" onclick="deleteScript('${s.id}')">🗑 Delete</button><textarea class="script-text" id="txt-${s.id}" rows="${rows}" oninput="autoSave('${s.id}')">${esc(scriptText)}</textarea><button class="copy-btn" id="cbtn-${s.id}" onclick="copyIt('${s.id}')">Copy</button></div><div class="save-indicator" id="saved-${s.id}"></div></div>`;
}

// ── GROUPS ────────────────────────────────────────────
function addGroup(tabId){const label=prompt('Group name:');if(!label?.trim())return;GROUPS.push({id:'grp-'+Date.now(),tabId,label:label.trim()});persist();buildAll();showTab(tabId);}
function deleteGroup(groupId,tabId){
  const group=GROUPS.find(g=>g.id===groupId);const count=SCRIPTS.filter(s=>s.groupId===groupId).length;
  const msg=count?`Delete group "${group?.label}"? The ${count} script${count>1?'s':''} inside will become ungrouped.`:`Delete group "${group?.label}"?`;
  if(!confirm(msg))return;
  GROUPS=GROUPS.filter(g=>g.id!==groupId);SCRIPTS.forEach(s=>{if(s.groupId===groupId)s.groupId=null;});
  persist();buildAll();showTab(tabId);
}
function startGroupRename(groupId){
  const group=GROUPS.find(g=>g.id===groupId);const nameSpan=document.getElementById('grp-name-'+groupId);const lbl=document.getElementById('grp-lbl-'+groupId);if(!nameSpan||!group)return;
  const input=document.createElement('input');input.className='section-rename-input';input.value=group.label;nameSpan.replaceWith(input);
  lbl.querySelectorAll('.section-icon-btn').forEach(b=>b.style.display='none');input.focus();input.select();
  const save=()=>{const v=input.value.trim();if(v){group.label=v;persist();}buildAll();showTab(activeTab);};
  input.addEventListener('blur',save);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();input.blur();}if(e.key==='Escape'){buildAll();showTab(activeTab);}});
}

// ── MODAL ─────────────────────────────────────────────
function buildTabSelectInModal(){const sel=document.getElementById('m-tab');if(!sel)return;sel.innerHTML=TABS.map(t=>`<option value="${t.id}">${esc(t.label)}</option>`).join('');}
function refreshGroupSelect(preselect){
  const tabId=document.getElementById('m-tab')?.value;const sel=document.getElementById('m-group');if(!sel||!tabId)return;
  const tabGroups=GROUPS.filter(g=>g.tabId===tabId);
  sel.innerHTML=tabGroups.length?tabGroups.map(g=>`<option value="${g.id}">${esc(g.label)}</option>`).join('')+'<option value="">— Ungrouped —</option>':'<option value="">— No groups yet —</option>';
  if(preselect)sel.value=preselect;
}
function openModal(defaultTab,defaultGroup){
  document.getElementById('m-title').value='';document.getElementById('m-subject').value='';document.getElementById('m-when').value='';document.getElementById('m-script').value='';document.getElementById('m-type').value='note';
  document.getElementById('m-tab').value=defaultTab||activeTab;refreshGroupSelect(defaultGroup||null);
  selectedColor='c1';document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));document.querySelector('.color-swatch[data-cls="c1"]')?.classList.add('selected');
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}
function saveScript(){
  const title=document.getElementById('m-title').value.trim();const tab=document.getElementById('m-tab').value;const groupId=document.getElementById('m-group').value||null;
  const type=document.getElementById('m-type').value;const subject=document.getElementById('m-subject').value.trim();const when=document.getElementById('m-when').value.trim();const script=document.getElementById('m-script').value.trim();
  if(!title||!script){alert('Title and script body are required.');return;}
  const id='script_'+Date.now();SCRIPTS.push({id,tab,groupId,color:selectedColor,type,icon:type==='note'?'📝':'✉️',title,when:when||'Custom script',subject:subject||title,script});
  persist();closeModal();buildAll();showTab(tab);setTimeout(()=>selectScript(id,tab),50);
}
function deleteScript(id){
  if(!confirm('Delete this script? This cannot be undone.'))return;
  SCRIPTS=SCRIPTS.filter(s=>s.id!==id);sdel('edit_'+id);sdel('title_'+id);persist();buildAll();showTab(activeTab);
}

// ── RENAME ────────────────────────────────────────────
function startRename(id){
  const s=SCRIPTS.find(x=>x.id===id);const row=document.querySelector('#panel-'+id+' .title-row');const display=document.getElementById('title-display-'+id);const btn=row.querySelector('.rename-btn');
  const input=document.createElement('input');input.className='title-input';input.value=sget('title_'+id)||s.title;input.id='title-input-'+id;display.replaceWith(input);btn.textContent='✓ Save';btn.onclick=()=>saveRename(id);
  input.focus();input.select();input.addEventListener('keydown',e=>{if(e.key==='Enter')saveRename(id);if(e.key==='Escape'){buildAll();showTab(activeTab);}});
}
function saveRename(id){
  const input=document.getElementById('title-input-'+id);if(!input)return;const v=input.value.trim();if(!v)return;
  sset('title_'+id,v);const ci=SCRIPTS.findIndex(x=>x.id===id);if(ci>=0){SCRIPTS[ci].title=v;persist();}
  buildAll();showTab(activeTab);setTimeout(()=>selectScript(id,activeTab),40);
}

// ── AUTO-SAVE / COPY ──────────────────────────────────
let saveTimer=null;
function autoSave(id){
  clearTimeout(saveTimer);saveTimer=setTimeout(()=>{
    const val=document.getElementById('txt-'+id)?.value;if(val!==undefined){sset('edit_'+id,val);const ind=document.getElementById('saved-'+id);if(ind){ind.textContent='✓ Saved';ind.style.color='#4caf82';setTimeout(()=>{if(ind)ind.textContent='';},2000);}}
  },800);
}
function copyIt(id){
  const s=SCRIPTS.find(x=>x.id===id);const body=document.getElementById('txt-'+id).value;let text;
  if(s.type==='email'){const subj=document.getElementById('subj-'+id)?.value||s.subject;text='Subject: '+subj+'\n\n'+body;}
  else{const dateVal=document.getElementById('date-'+id)?.value.trim()||'[DATE]';text='Date: '+dateVal+'\nSubject: '+s.subject+'\n\n'+body;}
  navigator.clipboard.writeText(text).then(()=>{const btn=document.getElementById('cbtn-'+id);btn.textContent='✓ Copied!';btn.classList.add('done');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('done');},2000);});
}

// ── COLOR GRID ────────────────────────────────────────
function buildColorGrid(){
  const grid=document.getElementById('colorGrid');grid.innerHTML='';
  COLORS.forEach(c=>{const sw=document.createElement('div');sw.className='color-swatch';sw.style.background=c.hex;sw.setAttribute('data-cls',c.cls);sw.onclick=()=>{selectedColor=c.cls;document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));sw.classList.add('selected');};grid.appendChild(sw);});
}

// ── TAB MANAGER ───────────────────────────────────────
function openTabManager(){
  const list=document.getElementById('tabManagerList');list.innerHTML='';
  TABS.forEach(t=>{const row=document.createElement('div');row.className='tab-manager-row';row.dataset.id=t.id;row.innerHTML=`<input type="text" value="${esc(t.label)}" maxlength="40"><button class="tab-remove-btn" onclick="this.closest('.tab-manager-row').remove()">✕</button>`;list.appendChild(row);});
  document.getElementById('tabManagerModal').classList.add('open');
}
function closeTabManager(){document.getElementById('tabManagerModal').classList.remove('open');}
function addTabRow(){const list=document.getElementById('tabManagerList');const row=document.createElement('div');row.className='tab-manager-row';row.dataset.id='tab-'+Date.now();row.innerHTML='<input type="text" value="" placeholder="New tab name…" maxlength="40"><button class="tab-remove-btn" onclick="this.closest(\'.tab-manager-row\').remove()">✕</button>';list.appendChild(row);row.querySelector('input').focus();}
function saveTabManager(){
  const rows=document.querySelectorAll('#tabManagerList .tab-manager-row');const newTabs=[];
  rows.forEach(row=>{const l=row.querySelector('input').value.trim();if(l)newTabs.push({id:row.dataset.id,label:l});});
  if(!newTabs.length){alert('Add at least one tab.');return;}
  TABS=newTabs;persist();activeTab=TABS[0].id;closeTabManager();buildAll();showTab(activeTab);
}

// ── NAVIGATION ────────────────────────────────────────
function selectScript(id,tab){
  document.querySelectorAll('#view-'+tab+' .script-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('#sidebar-'+tab+' .script-btn').forEach(b=>b.classList.remove('active'));
  const ph=document.getElementById('placeholder-'+tab);if(ph)ph.style.display='none';
  document.getElementById('panel-'+id)?.classList.add('active');document.getElementById('btn-'+id)?.classList.add('active');
}
function showTab(id){
  activeTab=id;
  document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id)?.classList.add('active');document.getElementById('tab-'+id)?.classList.add('active');
  document.getElementById('searchPage').classList.remove('active');document.getElementById('searchBox').value='';document.getElementById('clearBtn').style.display='none';
}

// ── SEARCH ────────────────────────────────────────────
function doSearch(q){
  q=q.trim();if(!q){clearSearch();return;}
  const ql=q.toLowerCase();const tabMap={};TABS.forEach(t=>tabMap[t.id]=t.label);
  const matches=SCRIPTS.filter(s=>(s.title+' '+s.when+' '+s.script+' '+s.subject).toLowerCase().includes(ql));
  document.getElementById('clearBtn').style.display='inline';
  document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('searchPage').classList.add('active');document.getElementById('searchBanner').classList.add('on');
  document.getElementById('searchBanner').textContent=matches.length+' result'+(matches.length!==1?'s':'')+' for "'+q+'"';
  document.getElementById('searchResults').innerHTML=matches.length?matches.map(s=>`<div class="search-hit" onclick="goToScript('${s.id}','${s.tab}')"><div class="search-hit-title">${s.icon||'📄'} ${esc(s.title)}</div><div class="search-hit-tab">${esc(tabMap[s.tab]||s.tab)}</div><div class="search-hit-when">${esc(s.when)}</div></div>`).join(''):`<div style="color:var(--muted);padding:40px;text-align:center">No results for "<strong>${esc(q)}</strong>"</div>`;
}
function goToScript(id,tab){clearSearch();showTab(tab);setTimeout(()=>selectScript(id,tab),40);}
function clearSearch(){document.getElementById('searchBox').value='';document.getElementById('clearBtn').style.display='none';document.getElementById('searchBanner').classList.remove('on');document.getElementById('searchPage').classList.remove('active');showTab(activeTab);}

['modalOverlay','importModal','tabManagerModal'].forEach(id=>{document.getElementById(id).addEventListener('click',e=>{if(e.target===document.getElementById(id)){if(id==='modalOverlay')closeModal();else if(id==='importModal')closeImportModal();else closeTabManager();}});});

buildAll();showTab(activeTab);checkBanner();
</script>
</body>
</html>
